<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>週末の予定</title>
<style>
:root{color-scheme:light;--ink:#534a63;--pink:#f8dce8;--border:#d8b7d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 20%,#ffe5ef 0 14%,transparent 35%),radial-gradient(circle at 85% 80%,#ddd8ff 0 10%,transparent 36%),linear-gradient(130deg,#fff9e9,#fff1f8 56%,#f0eeff);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:var(--ink)}
.panel{position:relative;width:min(760px,100%);padding:85px 32px 38px;border:3px solid #f2d4e5;border-radius:34px;background:#fffdfef0;box-shadow:0 18px 45px #a989b528,0 4px 0 #ffffff inset}
.refresh{position:absolute;right:25px;top:19px;border:2px solid #d6c5ed;background:#f2eaff;color:#7a64a3;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 #d7c7e8;transition:transform .15s}
.refresh:hover{background:#e9dcff;transform:translateY(-2px)}.refresh:active{transform:translateY(3px);box-shadow:0 1px 0 #d7c7e8}.refresh svg{width:29px;height:29px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sparkle{position:absolute;top:24px;left:28px;font-size:26px;letter-spacing:7px;color:#e7a6c5}
.instructions{margin:0 4px 20px;font-size:clamp(15px,2.4vw,19px);line-height:1.8;font-weight:600;color:#675b77}.instructions p{margin:0}.instructions p:first-child{font-weight:800;color:#9b668b;font-size:1.12em;margin-bottom:3px}table{width:100%;border-collapse:separate;border-spacing:0 14px;table-layout:fixed;font-size:clamp(22px,4vw,35px);font-weight:700}
th,td{height:100px;text-align:center;vertical-align:middle;border-top:3px solid var(--border);border-bottom:3px solid var(--border);background:#fffbfd;color:#534a63}th{width:44%;border-left:3px solid var(--border);border-right:2px dashed #dfc8dd;border-radius:22px 0 0 22px;background:#ffe8f0}td{border-right:3px solid var(--border);border-radius:0 22px 22px 0;background:#f6f1ff}tr:nth-child(2) th{background:#fff0d9}tr:nth-child(2) td{background:#fff9ee}tr:nth-child(3) th{background:#e7f5ef}tr:nth-child(3) td{background:#f0faf5}
.cn{font-size:.47em;font-weight:500;color:#877b93;white-space:nowrap;margin-left:.18em;vertical-align:middle}
@media(max-width:480px){.panel{padding:72px 12px 18px;border-radius:24px}.refresh{right:15px;top:14px;width:48px;height:48px}table{border-spacing:0 10px}th,td{height:84px} }
</style>
</head>
<body>
<main class="panel"><span class="sparkle" aria-hidden="true">✿ ✧ ♡</span><button class="refresh" type="button" aria-label="シャッフル" title="シャッフル" onclick="shuffle()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 12-2L20 12M4 12l2.4 3a7 7 0 0 0 12 0"/></svg></button>
<section class="instructions" lang="zh-CN"><p>这是你的日程表。</p><p>邀请朋友去吃你推荐的美食，问问什么时候去、几点去。</p></section>
<table aria-label="曜日と予定"><tbody><tr><th scope="row">きんようび<span class="cn">（星期五）</span></th><td id="p0"></td></tr><tr><th scope="row">どようび<span class="cn">（星期六）</span></th><td id="p1"></td></tr><tr><th scope="row">にちようび<span class="cn">（星期日）</span></th><td id="p2"></td></tr></tbody></table>
</main>
<script>
const plans=[['アルバイト','兼职'],['ようじ','有事'],['やくそく','有约'],['じゅぎょう','有课']];
let previous='';
function shuffle(){
  let entries,key;
  do {
    const count=1+Math.floor(Math.random()*2);
    const days=[0,1,2].sort(()=>Math.random()-.5).slice(0,count);
    entries=days.map(day=>({day,plan:plans[Math.floor(Math.random()*plans.length)]}));
    key=entries.map(e=>`${e.day}:${e.plan[0]}`).sort().join('|');
  } while(key===previous);
  previous=key;
  for(let i=0;i<3;i++)document.getElementById('p'+i).textContent='';
  entries.forEach(e=>{
    const cell=document.getElementById('p'+e.day);
    cell.append(document.createTextNode(e.plan[0]));
    const cn=document.createElement('span');cn.className='cn';cn.textContent='（'+e.plan[1]+'）';cell.append(cn);
  });
}
shuffle();
</script>
</body></html>
