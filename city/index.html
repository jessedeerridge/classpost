<style>

font-family:"Yu Kyokasho","YuKyokasho","BIZ UDPGothic","Noto Sans JP",sans-serif}

border-radius:14px;padding:5px;display:flex;flex-direction:column;gap:4px}
.empty{height:100%;display:grid;place-items:center;color:#aaa;font-size:14px}
.post{background:#fff;border:1px solid #dbe6d6;border-left:4px solid var(--sel);
border-radius:9px;padding:6px;font-size:16px;flex:0 0 auto}
.composer{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}

.question{text-align:center;font-size:20px;font-weight:600;margin:3px 0 6px}

font-size:19px;font-weight:600;white-space:nowrap;margin-bottom:5px}
.preview-place{
 position:relative;background:var(--area);color:#234f63;border-radius:8px;padding:5px 8px}
.post-btn{border:0;border-radius:9px;background:var(--dark);color:#fff;padding:8px 16px;font-weight:700;cursor:pointer}
.post-btn:disabled{opacity:.28;cursor:default}
.place-box{background:var(--area);border-radius:11px;padding:6px}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.choice{min-height:39px;border:1px solid #76a862;border-radius:7px;background:var(--btn);color:#234f63;
padding:3px 2px;cursor:pointer;font:inherit}
.choice.selected{background:var(--sel);border-color:#286b8a}
.jp{display:block;font-size:14px;font-weight:600;line-height:1}
.cn{display:block;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:10px;line-height:1;
margin-top:3px;opacity:.75}

.pattern{min-width:120px;border:1px solid #76a862;border-radius:8px;background:var(--btn);color:#234f63;
padding:7px 10px;font:600 17px inherit;cursor:pointer;transition:.15s}
.pattern.selected{background:var(--sel);border-color:#286b8a}
.pattern.disabled{opacity:.18;cursor:default;filter:grayscale(.5)}
.name-modal{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:99;display:flex;align-items:center;justify-content:center}
.name-box{background:#fff;border-radius:16px;padding:22px;width:min(340px,90vw);text-align:center}
.name-input{width:100%;border:1.5px solid #ccc;border-radius:10px;padding:11px;font-size:16px;text-align:center}
.name-save{margin-top:12px;border:0;border-radius:9px;background:var(--dark);color:#fff;padding:9px 22px;font-weight:700}
.hidden{display:none!important}
@media(max-width:700px){

 .preview{font-size:15px;min-height:32px;gap:3px;margin-bottom:3px}.preview-place{padding:4px 5px}

 .post-btn{padding:6px 10px;font-size:12px}input{font-size:16px!important}

/* v97 responsive 私も */
.post{position:relative!important}
.me-too-wrap{display:flex!important;align-items:center!important;gap:5px!important;width:max-content!important;max-width:100%!important}
.post.metoo-inline .me-too-wrap{position:absolute!important;right:6px!important;bottom:4px!important;margin:0!important}
.post.metoo-row2 .me-too-wrap,.post.metoo-row3 .me-too-wrap{position:static!important;margin-top:3px!important;margin-left:auto!important}
.post.metoo-row2 .me-too-count{position:absolute!important;right:6px!important;top:4px!important}
.post.metoo-row3 .me-too-count,.post.metoo-inline .me-too-count{position:static!important}


/* ===== v98 私も配置・実測版 ===== */
.post{position:relative!important}
.me-too-wrap{box-sizing:border-box!important}

.post.metoo-inline .me-too-wrap{
 position:absolute!important;
 margin:0!important;
 z-index:3!important;
}
.post.metoo-row2 .me-too-wrap,
.post.metoo-row3 .me-too-wrap{
 position:relative!important;
 left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;
 margin:3px 0 0 auto!important;
 width:max-content!important;
}
.post.metoo-row2 .me-too-count{
 position:absolute!important;
 z-index:4!important;
}
.post.metoo-row3 .me-too-count,
.post.metoo-inline .me-too-count{
 position:static!important;
}


/* v100: 私もが2段目のとき、✋×Nは一段目の右端 */
.post.metoo-row2 .me-too-count{
 left:auto!important;
 right:6px!important;
 bottom:auto!important;
 margin:0!important;
}


/* v101: 2段目時のカウントは post 直下。一段目右端に固定 */
.post.metoo-row2 > .me-too-count{
 position:absolute!important;
 left:auto!important;
 right:6px!important;
 z-index:10!important;
 margin:0!important;
}


/* ===== v102：2段目のときの✋×Nは「1段目そのもの」の右端 ===== */
.post.metoo-row2 .posted-row:first-child{
 position:relative!important;
 padding-right:52px!important;
}
.post.metoo-row2 .posted-row:first-child > .me-too-count{
 position:absolute!important;
 right:0!important;
 left:auto!important;
 top:50%!important;
 bottom:auto!important;
 transform:translateY(-50%)!important;
 margin:0!important;
 z-index:10!important;
 white-space:nowrap!important;
}


/* ===== v103：2段目時の✋×Nは右端に独立表示 ===== */
.post.metoo-row2 .posted-row:first-child{
 padding-right:0!important;
}
.post.metoo-row2 .posted-row:first-child > .me-too-count{
 position:absolute!important;
 right:6px!important;
 left:auto!important;
 top:3px!important;
 transform:none!important;
 margin:0!important;
 z-index:10!important;
 white-space:nowrap!important;
}


/* ===== v104 最終指定 ===== */
.post.metoo-row2 > .me-too-count{
 position:absolute!important;
 right:6px!important;
 left:auto!important;
 bottom:auto!important;
 transform:none!important;
 margin:0!important;
 z-index:20!important;
 white-space:nowrap!important;
}
.post.metoo-row2 .posted-row:first-child{
 padding-right:0!important;
}


/* v105: 私もが2段目なら count は必ず1段目右端 */
.post.metoo-inline > .me-too-count,
.post.metoo-row2 > .me-too-count{
 position:absolute!important;
 right:6px!important;
 left:auto!important;
 z-index:30!important;
 white-space:nowrap!important;
}


/* ===== v106：✋×N は行レイアウトに一切参加させない ===== */
.post.metoo-inline > .me-too-count,
.post.metoo-row2 > .me-too-count{
 position:absolute!important;
 display:block!important;
 width:max-content!important;
 max-width:none!important;
 right:6px!important;
 left:auto!important;
 bottom:auto!important;
 margin:0!important;
 padding:0!important;
 transform:none!important;
 z-index:30!important;
 white-space:nowrap!important;
 pointer-events:none!important;
}
.post.metoo-inline .posted-row,
.post.metoo-row2 .posted-row{
 flex-wrap:nowrap!important;
}

.post.metoo-inline .me-too-wrap{

.post.metoo-row2 .me-too-wrap,

/* ===== v108：✋×N は常に一段目の右端 ===== */

<script>
const NAME_KEY="weekend_user_name_v1";
const POSTS_KEY="shusshin_posts_v1";
const METOO_KEY="shusshin_metoo_by_name_v1";
const OFFLINE_QUEUE_KEY="shusshin_offline_queue_v1";
let userName=localStorage.getItem(NAME_KEY)||"";
let posts=[];
try{posts=JSON.parse(localStorage.getItem(POSTS_KEY))||[]}catch{posts=[]}

const adjectives=[
 ["おおきい","大",false],["ちいさい","小",false],
 ["しずか","安静",true],["にぎやか","热闹",true],
 ["きれい","漂亮",true],
 ["みどりが おおい","绿化多",false],["ひとが おおい","人多",false],
 ["いい","好",false]
];
let selectedAdjs=[];
const things=[
 ["やま","山"],["かわ","河"],["うみ","海"],["おてら","寺庙"],
 ["こうえん","公园"],["おおきい たてもの","大型建筑"],["きれいな たてもの","漂亮的建筑"],["ゆうえんち","游乐园"],["すいぞくかん","水族馆"]
];
let selectedThing="";
let selectedNameAdjs=[];
const nameAdjectives=[
 ...adjectives,
 ["たのしい","玩得开心",false],
 ["おもしろい","有趣",false],
 ["ゆうめい","有名",true]
];

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function inputValue(){return document.getElementById("shusshinInput").value.trim()}
function alignSecondAnswer(){}

function renderAdj(){
 const area=document.getElementById("adjArea"); area.innerHTML="";
 adjectives.forEach(([jp,cn])=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="choice"+(selectedAdjs.includes(jp)?" selected":"");
  b.innerHTML=`<span class="jp">${jp}</span><span class="cn">${cn}</span>`;
  b.onclick=()=>{
   const i=selectedAdjs.indexOf(jp);
   if(i>=0){
     selectedAdjs=[];
   }else{
     selectedAdjs=[jp];
   }
   renderAdj();
   updateComposer();
  };
  area.appendChild(b);
 });
}
function renderNameAdj(){
 const area=document.getElementById("nameAdjArea");
 if(!area)return;
 area.innerHTML="";
 nameAdjectives.forEach(([jp,cn])=>{
  const b=document.createElement("button");
  b.type="button";
  const sizeLocked=(selectedThing==="おおきい たてもの" && (jp==="おおきい" || jp==="ちいさい"));
  b.disabled=sizeLocked;
  b.className="choice"+(selectedNameAdjs.includes(jp)?" selected":"")+(sizeLocked?" disabled-choice":"");
  b.innerHTML=`<span class="jp">${jp}</span><span class="cn">${cn}</span>`;
  b.onclick=()=>{
   const i=selectedNameAdjs.indexOf(jp);

   if(i>=0){
     selectedNameAdjs.splice(i,1);
   }else{
     // 3段目も対になる語は、後から押した方を優先
     const opposite={
       "おおきい":"ちいさい",
       "ちいさい":"おおきい",
       "にぎやか":"しずか",
       "しずか":"にぎやか"
     }[jp];

     if(opposite){
       const oi=selectedNameAdjs.indexOf(opposite);
       if(oi>=0) selectedNameAdjs.splice(oi,1);
     }

     selectedNameAdjs.push(jp);
     if(selectedNameAdjs.length>2) selectedNameAdjs.shift();
   }

   renderNameAdj();
   updateComposer();
  };
  area.appendChild(b);
 });
}
function renderThings(){
 const area=document.getElementById("thingArea");
 if(!area)return;
 area.innerHTML="";
 things.forEach(([jp,cn])=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="choice"+(selectedThing===jp?" selected":"");
  b.innerHTML=`<span class="jp">${jp}</span><span class="cn">${cn}</span>`;
  b.onclick=()=>{
   selectedThing=jp;
   if(selectedThing==="おおきい たてもの"){
     selectedNameAdjs=selectedNameAdjs.filter(x=>x!=="おおきい" && x!=="ちいさい");
   }
   renderThings();
   renderNameAdj();
   updateComposer();
  };
  area.appendChild(b);
 });
}
function updateComposer(){
 const v=inputValue(), second=document.getElementById("shusshinSecond");
 const adjTable=document.getElementById("adjTable");
 if(adjTable) adjTable.style.display=v?"block":"none";
 if(!v && (selectedAdjs.length || selectedThing)){
   selectedAdjs=[];
   selectedThing="";
   renderAdj();
   renderThings();
 }
 second.style.display=v?"contents":"none";
 const subjectHtml=v?`<span>${esc(v)}</span>`:"";
 document.getElementById("shusshinSubject").innerHTML=subjectHtml;
 const q2Cell=document.querySelector(".q2");
if(q2Cell) q2Cell.style.display=v?"block":"none";
const a2Cell=document.getElementById("shusshinSubjectAnswer").parentElement;
 a2Cell.style.display=selectedAdjs.length?"flex":"none";
 a2Cell.style.visibility=selectedAdjs.length?"visible":"hidden";
 document.getElementById("shusshinSubjectAnswer").textContent=v;
 const showThird=!!(v&&(selectedAdjs.length || selectedThing));

const DB_POSTS_PATH="shusshinSentence/posts";
let db,dbRef,dbSet,dbRemove,dbRunTransaction,firebaseReady=false;
function readQ(){try{return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY))||[]}catch{return []}}
function writeQ(q){localStorage.setItem(OFFLINE_QUEUE_KEY,JSON.stringify(q))}
function queue(op){const q=readQ();q.push({...op,qid:Date.now()+"_"+Math.random()});writeQ(q)}
async function flushQ(){
 if(!firebaseReady||!navigator.onLine)return;
 const remain=[];
 for(const op of readQ()){
  try{
   if(op.type==="post")await dbSet(dbRef(db,DB_POSTS_PATH+"/"+op.post.id),op.post);
   if(op.type==="delete")await dbRemove(dbRef(db,DB_POSTS_PATH+"/"+op.id));
   if(op.type==="metoo")await dbRunTransaction(dbRef(db,DB_POSTS_PATH+"/"+op.id+"/meTooCount"),v=>Number(v||0)+1);
  }catch(e){remain.push(op)}
 }
 writeQ(remain);
}
async function syncPostToDB(p){
 if(!firebaseReady||!navigator.onLine){queue({type:"post",post:p});return}
 try{await dbSet(dbRef(db,DB_POSTS_PATH+"/"+p.id),p)}catch{queue({type:"post",post:p})}
}

  D.onValue(dbRef(db,DB_POSTS_PATH),snap=>{

<script>
/* v112: 本文を先に100%幅で描画し、実際の各表示行を測って反応UIを置く */
(()=>{
 const GAP=10, RIGHT=7;

 function rectsOf(root){
   const a=[];
   const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
   let n;
   while((n=w.nextNode())){
     if(!n.nodeValue?.trim())continue;
     const e=n.parentElement;
     if(!e || e.closest(".posted-cn"))continue;
     const cs=getComputedStyle(e);
     if(cs.display==="none"||cs.visibility==="hidden")continue;
     const r=document.createRange(); r.selectNodeContents(n);
     [...r.getClientRects()].forEach(x=>{if(x.width>0&&x.height>0)a.push(x)});
   }
   root.querySelectorAll(".posted-card,.na-card").forEach(e=>{
     const x=e.getBoundingClientRect();
     if(x.width>0&&x.height>0)a.push(x);
   });
   return a;
 }
 function rowsOf(rects){
   const rows=[];
   rects.sort((a,b)=>a.top-b.top||a.left-b.left).forEach(r=>{
     let q=rows.find(x=>Math.abs(x.top-r.top)<=4);
     if(!q) rows.push(q={top:r.top,bottom:r.bottom,right:r.right});
     else {q.top=Math.min(q.top,r.top);q.bottom=Math.max(q.bottom,r.bottom);q.right=Math.max(q.right,r.right);}
   });
   return rows.sort((a,b)=>a.top-b.top);
 }
 function place(post){
   const row=post.querySelector(".posted-row");
   const wrap=post.querySelector(":scope > .me-too-wrap");
   const btn=wrap?.querySelector(".me-too-btn");
   const count=post.querySelector(":scope > .me-too-count");
   if(!row||!wrap||!btn||!count)return;

   post.classList.remove("metoo-inline","metoo-row2","metoo-row3","reaction-inline",
                         "reaction-on-last-line","reaction-fit-last-line");
   post.style.removeProperty("--reaction-btn-top");
   post.style.removeProperty("--reaction-count-top");

   const rows=rowsOf(rectsOf(row));
   if(!rows.length)return;

   const pr=post.getBoundingClientRect();
   const cs=getComputedStyle(post);
   const innerRight=pr.right-parseFloat(cs.borderRightWidth||0)-parseFloat(cs.paddingRight||0)-RIGHT;
   const last=rows.at(-1);
   const bw=btn.getBoundingClientRect().width;

   if(innerRight-last.right >= bw+GAP){
     const br=btn.getBoundingClientRect();
     const btnTop=(last.top+last.bottom-br.height)/2-pr.top;
     post.style.setProperty("--reaction-btn-top",Math.max(0,btnTop)+"px");

     /* 一つ前の表示行がある時だけ、その行に♥×Nを置く */
     if(rows.length>=2 && count.textContent.trim()){
       const prev=rows.at(-2);
       const ch=count.getBoundingClientRect().height || 14;
       const countTop=(prev.top+prev.bottom-ch)/2-pr.top;
       post.style.setProperty("--reaction-count-top",Math.max(0,countTop)+"px");
     }else{
       /* 前の行がない場合は本文の上に重ねず、通常位置を維持 */
       post.style.setProperty("--reaction-count-top",(last.top-pr.top-Math.max(14,count.getBoundingClientRect().height)-3)+"px");
     }
     post.classList.add("reaction-fit-last-line");
   }
 }
 let id=0;
 function run(){
   cancelAnimationFrame(id);
   id=requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".post").forEach(place)));
 }
 const feed=document.getElementById("feed");
 if(feed){
   new MutationObserver(run).observe(feed,{childList:true,subtree:true,characterData:true});
   if("ResizeObserver" in window)new ResizeObserver(run).observe(feed);
 }
 window.addEventListener("resize",run);
 document.fonts?.ready?.then(run);
 run();
})();
</script>

</body>
</html>

<style>
.me-too-wrap{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:4px}
.me-too-count{font-size:13px;color:#286b8a;font-weight:700;white-space:nowrap}
.me-too-btn{border:1px solid #9bcbe0;background:#f5fbf2;color:#286b8a;border-radius:9px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer}
.me-too-btn:hover{background:#eef9fd}
.me-too-btn.liked{background:#d8ebcf;color:#234f63;border-color:#8eb47c}
.me-too-btn:disabled{cursor:default;opacity:.58}
</style>
