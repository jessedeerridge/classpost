<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>しゅうまつ、なにをしますか。</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#dcebd4;--panel:#fff;--ink:#292929;--line:#9fbe91;
  --area:#c7e2b9;--btn:#edf7e8;--sel:#79b85d;--dark:#3f7e2e;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
font-family:"Yu Kyokasho","YuKyokasho","BIZ UDPGothic","Noto Sans JP",sans-serif}
.app{width:min(1050px,96vw);margin:auto;padding:10px 0 24px}
.board-title{font-size:13px;color:#777;margin:0 0 3px 3px}
.feed{height:275px;overflow-y:auto;background:rgba(255,255,255,.75);border:1px solid var(--line);
border-radius:14px;padding:5px;display:flex;flex-direction:column;gap:4px}
.empty{height:100%;display:grid;place-items:center;color:#aaa;font-size:14px}
.post{background:#fff;border:1px solid #dbe6d6;border-left:4px solid var(--sel);
border-radius:9px;padding:6px;font-size:16px;flex:0 0 auto}
.composer{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.guide{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;color:#666;font-size:14px;margin-bottom:3px}
.question{text-align:center;font-size:20px;font-weight:600;margin:3px 0 6px}
.preview{display:flex;justify-content:center;align-items:center;gap:5px;min-height:40px;
font-size:19px;font-weight:600;white-space:nowrap;margin-bottom:5px}
.preview-place{
 position:relative;background:var(--area);color:#315f24;border-radius:8px;padding:5px 8px}
.post-btn{border:0;border-radius:9px;background:var(--dark);color:#fff;padding:8px 16px;font-weight:700;cursor:pointer}
.post-btn:disabled{opacity:.28;cursor:default}
.place-box{background:var(--area);border-radius:11px;padding:6px}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.choice{min-height:39px;border:1px solid #76a862;border-radius:7px;background:var(--btn);color:#315f24;
padding:3px 2px;cursor:pointer;font:inherit}
.choice.selected{background:var(--sel);border-color:#3f7e2e}
.jp{display:block;font-size:14px;font-weight:600;line-height:1}
.cn{display:block;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:10px;line-height:1;
margin-top:3px;opacity:.75}
.patterns{display:flex;justify-content:center;gap:8px;margin-top:5px}
.pattern{min-width:120px;border:1px solid #76a862;border-radius:8px;background:var(--btn);color:#315f24;
padding:7px 10px;font:600 17px inherit;cursor:pointer;transition:.15s}
.pattern.selected{background:var(--sel);border-color:#3f7e2e}
.pattern.disabled{opacity:.18;cursor:default;filter:grayscale(.5)}
.name-modal{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:99;display:flex;align-items:center;justify-content:center}
.name-box{background:#fff;border-radius:16px;padding:22px;width:min(340px,90vw);text-align:center}
.name-input{width:100%;border:1.5px solid #ccc;border-radius:10px;padding:11px;font-size:16px;text-align:center}
.name-save{margin-top:12px;border:0;border-radius:9px;background:var(--dark);color:#fff;padding:9px 22px;font-weight:700}
.hidden{display:none!important}
@media(max-width:700px){
 .app{padding-top:5px}.feed{height:275px}.composer{margin-top:6px;padding:6px}
 .guide{font-size:13px;margin-bottom:1px}.question{font-size:15px;margin:2px 0 3px}
 .preview{font-size:15px;min-height:32px;gap:3px;margin-bottom:3px}.preview-place{padding:4px 5px}
 .choices{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
 .choice{min-height:34px;padding:2px 1px}.jp{font-size:13px}.cn{font-size:10px;margin-top:2px}
 .patterns{margin-top:4px;gap:5px}.pattern{min-width:105px;padding:5px 7px;font-size:15px}
 .post-btn{padding:6px 10px;font-size:12px}input{font-size:16px!important}
}

.preview-place,.post-place{position:relative;margin-bottom:10px}
.preview-cn,.post-cn{
  position:absolute;left:0;right:0;top:calc(100% + 2px);
  text-align:center;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:11px;font-weight:500;line-height:1;color:#555;white-space:nowrap
}
.post-line{display:flex;align-items:center;gap:3px;white-space:nowrap;min-height:34px}
.post-place{display:inline-flex;align-items:center;justify-content:center;background:var(--area);
  color:#315f24;border-radius:7px;padding:4px 6px}
@media(max-width:700px){

 .preview-place,.post-place{margin-bottom:9px}
}


.second-stage{display:none;margin-top:4px}
.second-stage.show{display:block}
.second-place-box{background:var(--area);border-radius:11px;padding:6px}
.second-choice{min-height:39px;border:1px solid #76a862;border-radius:7px;background:var(--btn);
 color:#315f24;padding:3px 2px;font:inherit}
.second-choice.locked{opacity:.18}
.second-choice.active{background:var(--sel);border-color:#3f7e2e}
.second-patterns{display:flex;justify-content:center;margin-top:4px}
.second-de{min-width:120px;border:1px solid #76a862;border-radius:8px;background:var(--btn);
 color:#315f24;padding:7px 10px;font:600 17px inherit;cursor:pointer}
.second-de.selected{background:var(--sel);border-color:#3f7e2e}

/* 投稿の訳は日本語の下に固定。文の位置を上げない */
.post{padding-bottom:13px}
.post-line{min-height:38px;align-items:flex-start;padding-top:4px}
.post-place{margin-bottom:0!important}
.post-cn{top:calc(100% + 2px)!important;transform:none!important;line-height:1!important}

@media(max-width:700px){
 .second-stage{margin-top:3px}
 .second-place-box{padding:3px}
 .second-choice{min-height:34px;padding:2px 1px}
 .second-patterns{margin-top:3px}
 .second-de{min-width:105px;padding:5px 7px;font-size:15px}
 .post{padding-bottom:12px}
 .post-line{min-height:36px;padding-top:3px}
}

  padding-bottom:13px !important;

/* ===== 2段目 名詞群 ===== */
.noun-area{margin-top:5px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.noun-group{background:#fffbd1;border-radius:14px;padding:7px}
.noun-group:last-child{grid-column:1 / -1}
.noun-title{text-align:center;font-size:12px;font-weight:700;margin-bottom:5px;color:#555}
.noun-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}

 .noun-choice{min-height:34px;font-size:12px}
 .noun-group:last-child .noun-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}


/* ===== 名詞群は分類せず1つに統一 ===== */
.noun-area{
 display:grid !important;

<body>
<div id="nameModal" class="name-modal">
 <div class="name-box">
  <input id="nameInput" class="name-input" placeholder="请输入姓名" maxlength="20">
  <button class="name-save" onclick="saveName()">确定</button>
 </div>
</div>

<div class="app">
 <div class="board-title">发布</div>
 <div id="feed" class="feed"><div class="empty">まだ投稿がありません。</div></div>

 <div class="composer">
  <div class="guide"><span id="modeGuideText">发布一下自己的周末安排吧。</span></div>
  <div class="mode-switch-wrap">

    <button type="button" id="weekendModeBtn" class="mode-switch-btn active" onclick="setActivityMode('weekend')">周末</button>
    <button type="button" id="afternoonModeBtn" class="mode-switch-btn" onclick="setActivityMode('afternoon')">下午</button>

   <div id="places" class="choices"></div>

  <div id="secondStage" class="second-stage">

   </div>

    <span>を</span>
   </div>
   <div id="verbArea" class="verb-area"></div>
   
  
  </div>
 </div>

<script>
const places=[
 ["りょう","宿舍"],
 ["そと","外面"],["おみせ","商店"],["そとのおみせ","外面商店"],["がっこう","学校"],
 ["としょかん","图书馆"],["ショッピングモール","购物中心"],["しょくどう","食堂"],["スーパー","超市"],
 ["グラウンド","运动场"],["コート","球场"],["たいいくかん","体育馆"],["こうえん","公园"],
 ["カラオケ","卡拉OK"],["うち","家"],["りょこう","旅行"],["やまに のぼります","爬山"],["でかけます","外出"]
];
const nouns=[
 ["ごはん","饭"],["ビール","啤酒"],
 ["バスケ","篮球"],["サッカー","足球"],["卓球","乒乓球"],["ビリヤード","台球"],
 ["バレーボール","排球"],["バドミントン","羽毛球"],["ゲーム","游戏"],["ダンス","舞蹈"],
 ["りょうり","做饭"],["アルバイト","打工"],["パーティー","聚会"],["バーベキュー","烧烤"],
 ["スマホ","手机"],["アニメ","动漫"],["ドラマ","电视剧"],["えいが","电影"],
 ["まんが","漫画"],["しょうせつ","小说"],["おんがく","音乐"],["ふく","衣服"],
 ["おかし","零食"],["え","画"],["にほんご","日语"],["えいご","英语"],["しゃしん","照片"]
];
const verbs=[
 ["たべます。","吃","wo"],["のみます。","喝","wo"],["します。","做","wo"],
 ["みます。","看","wo"],["ききます。","听","wo"],["よみます。","读","wo"],
 ["かいます。","买","wo"],["かきます。","写／画","wo"],["べんきょうします。","学习","wo"],
 ["つくります。","制作／做饭","wo"],["とります。","拍（照片）／拿","wo"],
 ["かいものします。","购物","other"],["うんどうします。","运动","other"],
 ["あるきます。","走路","other"],["さんぽします。","散步","other"],
 ["はしります。","跑步","other"],["そうじします。","打扫","other"],
 ["うたいます。","唱歌","other"],
 
 ["～と あいます","和～见面","to"],["～と あそびます","一起玩","to"],
 ["～と はなします","说话","to"],["～と でんわします","打电话","to"]
];
let selectedVerb="";
let selectedNoun="";
let selectedPlace="",selectedPattern="";
let travelDestination="";
let userName=localStorage.getItem("weekend_user_name_v1")||"";
let posts=JSON.parse(localStorage.getItem("weekend_posts_v1")||"[]");

function saveName(){
 const v=document.getElementById("nameInput").value.trim();
 if(!v)return;
 userName=v;
 localStorage.setItem("weekend_user_name_v1",userName);
 document.getElementById("nameModal").style.display="none";
}
function renderPlaces(){
 const box=document.getElementById("places");box.innerHTML="";
 places.forEach(([jp,cn])=>{
  const b=document.createElement("button");
  b.className="choice"+(selectedPlace===jp?" selected":"");
  b.innerHTML=`<span class="jp">${jp}</span><span class="cn">${cn}</span>`;
  b.onclick=()=>selectPlace(jp);box.appendChild(b);
 });
}

/* 選択内容に合わせて、不自然な組み合わせを押せなくする */
const nounVerbMap={
 "ごはん":["たべます。","つくります。","かいます。"],
 "ビール":["のみます。","かいます。"],
 "バスケ":["します。","みます。"],"サッカー":["します。","みます。"],"卓球":["します。","みます。"],"ビリヤード":["します。","みます。"],
 "バレーボール":["します。","みます。"],"バドミントン":["します。","みます。"],"ゲーム":["します。","みます。","かいます。"],"ダンス":["します。","みます。"],
 "りょうり":["します。","つくります。"],"アルバイト":["します。"],"パーティー":["します。"],"バーベキュー":["します。"],
 "スマホ":["みます。","かいます。"],"アニメ":["みます。"],"ドラマ":["みます。"],"えいが":["みます。"],
 "まんが":["よみます。","かいます。"],"しょうせつ":["よみます。","かいます。","かきます。"],
 "おんがく":["ききます。"],"ふく":["かいます。"],"おかし":["たべます。","かいます。","つくります。"],
 "え":["かきます。","みます。"],"にほんご":["べんきょうします。","ききます。","よみます。"],"えいご":["べんきょうします。","ききます。","よみます。"],
 "しゃしん":["とります。","みます。"]
};
const noNounVerbs=new Set([
 "かいものします。","うんどうします。","あるきます。","さんぽします。",
 "はしります。","そうじします。","うたいます。",
 
 "～と あいます","～と あそびます","～と はなします","～と でんわします"
]);

/* 場所×名詞：可能性が少しでもある組み合わせは許可。
   「その場所でその名詞を目的語にする活動」が明らかに不自然な場合だけ除外する。 */
/* 場所×名詞：ユーザー指定＋残りは「確実に不自然」なものだけ禁止 */
const sportsNouns=new Set(["バスケ","サッカー","卓球","ビリヤード","バレーボール","バドミントン"]);

const placeNounBlocked={
 "りょう":["アルバイト","バーベキュー"],
 "そと":[],
 "がっこう":[],
 "としょかん":["ごはん","ビール","バスケ","サッカー","卓球","ビリヤード","バレーボール","バドミントン","りょうり","ゲーム","ダンス","しゃしん","ふく","おかし","パーティー","バーベキュー"],
 "おみせ":[],
 "そとのおみせ":[],
 "ショッピングモール":[],
 "しょくどう":[],
 "スーパー":["バスケ","サッカー","卓球","ビリヤード","バレーボール","バドミントン","にほんご","えいご","スマホ","アニメ","ドラマ","えいが","まんが","しょうせつ","しゃしん","りょうり","ゲーム","パーティー","ダンス","バーベキュー","え","おんがく","ふく"],

 /* 以下は「わりとあり得るなら許可」で、明確に変なものだけ */
 "グラウンド":["りょうり","えいが","しょうせつ","ふく"],
 "コート":["ごはん","ビール","ゲーム","りょうり","アルバイト","パーティー","バーベキュー","スマホ","アニメ","ドラマ","えいが","まんが","しょうせつ","おんがく","ふく","おかし","え","にほんご","えいご","しゃしん"],
 "たいいくかん":["ごはん","ビール","ゲーム","りょうり","アルバイト","パーティー","バーベキュー","スマホ","アニメ","ドラマ","えいが","まんが","しょうせつ","おんがく","ふく","おかし","え","にほんご","えいご","しゃしん"],
 "こうえん":[],
 "カラオケ":["バスケ","サッカー","卓球","ビリヤード","バレーボール","バドミントン","りょうり","バーベキュー"],
 "うち":[],
 "りょこう":[]
};
function nounFitsPlace(noun,place){
 if(!place)return true;
 return !(placeNounBlocked[place]||[]).includes(noun);
}

/* 名詞単体では成立しても、その場所で「スポーツをする」だけは不自然な場合 */
function comboFitsPlace(noun,verb,place){
 if(!place)return true;
 if(place==="しょくどう" && verb==="かいます。" && !["ごはん","ビール"].includes(noun))return false;
 if(place==="しょくどう" && noun==="ダンス" && verb==="します。")return false;
 if(verb==="します。" && sportsNouns.has(noun) && ["りょう","しょくどう","スーパー","カラオケ"].includes(place)) return false;
 return true;
}

function nounFitsVerb(noun,verb){
 if(!verb)return true;
 if(noNounVerbs.has(verb))return false;
 return (nounVerbMap[noun]||[]).includes(verb);
}
function verbFitsNoun(verb,noun){
 if(!noun)return true;
 return nounFitsVerb(noun,verb);
}
function verbFitsPlace(verb,place){
 if(!place)return true;
 if(["たいいくかん","コート"].includes(place) && new Set(["かいものします。","そうじします。","うたいます。","～と でんわします","～と あいます"]).has(verb))return false;
 if(place==="スーパー" && verb==="たべます。")return false;
 if(verb==="かいます。" && ["カラオケ","コート","たいいくかん","グラウンド","うち","としょかん"].includes(place))return false;
 if(place==="カラオケ" && new Set(["うんどうします。","かいものします。","あるきます。","さんぽします。","はしります。","そうじします。","～と でんわします","～と あいます"]).has(verb))return false;
 /* 場所が意味上ほぼ決まる動詞だけ制限する */
 if(verb==="やまに のぼります。")return place==="やま";
 
 if(verb==="つくります。" && ["りょう","としょかん","スーパー"].includes(place))return false;
 if(verb==="かいます。" && ["りょう","としょかん"].includes(place))return false;
 return true;
}
function hasAvailableVerbForNoun(noun){
 /* 現在の場所で、この名詞を選んだあと1つでも選べる動詞が残るか */
 return verbs.some(([v])=>
   nounFitsVerb(noun,v) &&
   verbFitsPlace(v,selectedPlace) &&
   comboFitsPlace(noun,v,selectedPlace)
 );
}
function refreshCompatibility(){
 document.querySelectorAll("#nounArea .noun-choice").forEach(btn=>{
   const n=btn.dataset.value;
   const placeOK=nounFitsPlace(n,selectedPlace);
   const currentVerbOK=!selectedVerb || (nounFitsVerb(n,selectedVerb) && comboFitsPlace(n,selectedVerb,selectedPlace));
   const leavesVerb=hasAvailableVerbForNoun(n);
   const ok=placeOK && currentVerbOK && leavesVerb;
   btn.disabled=!ok;
   btn.classList.toggle("choice-disabled",!ok);
 });
 document.querySelectorAll("#verbArea .verb-choice").forEach(btn=>{
   const v=btn.dataset.value;
   const verbData=verbs.find(x=>x[0]===v);
   const type=verbData?verbData[2]:"";
   const needsNoun=type==="wo";
   const ok=(!needsNoun || !!selectedNoun) &&
            verbFitsNoun(v,selectedNoun) &&
            verbFitsPlace(v,selectedPlace) &&
            (!selectedNoun || comboFitsPlace(selectedNoun,v,selectedPlace));
   btn.disabled=!ok;
   btn.classList.toggle("choice-disabled",!ok);
 });
}
function renderNouns(){
 const area=document.getElementById("nounArea");
 area.innerHTML="";
 nouns.forEach(([jp,cn])=>{
   const b=document.createElement("button");
   b.className="choice noun-choice"+(selectedNoun===jp?" selected":"");
   b.dataset.value=jp;
   b.innerHTML=`<span class="jp">${jp}</span><span class="cn">${cn}</span>`;
   b.onclick=()=>{
     if(b.disabled)return;
     const oldNoun=selectedNoun;
     selectedNoun=selectedNoun===jp?"":jp;
     if(selectedVerb && oldNoun!==selectedNoun) selectedVerb="";
     renderNouns(); renderVerbs(); updateNounPreview(); updateVerbPreview();
 refreshPostButton();
   };
   area.appendChild(b);
 });
 const hint=document.createElement("span");
 hint.className="noun-area-hint"; hint.textContent="を"; area.appendChild(hint);
 refreshCompatibility();
}
function updateNounPreview(){
 const ijp=document.getElementById("secondInlineNounJp");
 const icn=document.getElementById("secondInlineNounCn");
 const secondWo=document.getElementById("secondWo");
 const nounPreview=document.querySelector(".noun-preview");
 const secondLine=document.getElementById("secondPlaceLine");
 const found=nouns.find(x=>x[0]===selectedNoun);
 const isDorm=selectedPlace==="りょう";

 if(ijp)ijp.textContent=selectedNoun||"";
 if(icn)icn.textContent=found?found[1]:"";
 const nounCard=document.getElementById("secondInlineNoun");
 if(nounCard)nounCard.style.display=selectedNoun?"inline-flex":"none";
 if(secondWo)secondWo.textContent=selectedNoun?"を":"";

 if(nounPreview)nounPreview.style.display="none";
 if(secondLine)secondLine.style.display=isDorm?"none":"flex";

 /* 寮の場合も、名詞を選ぶたび上の一文を更新 */
 updatePreview();
}
function updateVerbPreview(){
 const wo=document.getElementById("secondWo");
 if(wo){
   let c=document.getElementById("inlineVerbCard");
   if(!c){
     c=document.createElement("span"); c.id="inlineVerbCard"; c.className="preview-place";
     c.innerHTML='<span id="inlineVerbJp"></span><span id="inlineVerbCn" class="preview-cn"></span>';
     wo.insertAdjacentElement("afterend",c);
   }
   const f=verbs.find(x=>x[0]===selectedVerb);
   document.getElementById("inlineVerbJp").textContent=selectedVerb||"";
   document.getElementById("inlineVerbCn").textContent=f?f[1]:"";
   c.style.display=(selectedPlace!=="りょう" && selectedVerb)?"inline-flex":"none";
 }
 updatePreview();
}
function renderVerbs(){
 const area=document.getElementById("verbArea");
 if(!area)return;
 area.innerHTML="";
 verbs.forEach(([jp,cn,type])=>{
   const b=document.createElement("button");
   b.className="choice verb-choice"+(selectedVerb===jp?" selected":"");
   b.dataset.value=jp;
   b.innerHTML=`<span class="jp">${jp}</span><span class="cn">${cn}</span>`;
   b.onclick=()=>{
     if(b.disabled)return;
     selectedVerb=selectedVerb===jp?"":jp;
     /* 動詞を選ぶと、合わない名詞は薄くして押せなくする */
     renderVerbs(); renderNouns(); updateVerbPreview(); updatePreview(); updateNounPreview();
 refreshPostButton();
   };
   area.appendChild(b);
 });
 refreshCompatibility();
}
function renderSecondStage(){
 const stage=document.getElementById("secondStage");
 const placeEl=document.getElementById("secondPlace");
 const secondLine=document.getElementById("secondPlaceLine");
 if(secondLine){
   secondLine.classList.toggle("waiting-place",!selectedPlace);
   secondLine.style.visibility="";
 }
 const show=true;
 stage.classList.add("show");
 renderNouns();
 renderVerbs();
 setTimeout(refreshCompatibility,0);
 updateVerbPreview();
 updateNounPreview();
 if(!selectedPlace){placeEl.innerHTML="";return}
 const found=places.find(x=>x[0]===selectedPlace);
 const secondDe=document.getElementById("secondDe");
 if(secondDe)secondDe.style.display="";
 if(placeEl)placeEl.style.display="inline-flex";
 if(selectedPlace==="りょこう" || selectedPlace==="でかけます"){
   updateTravelSecondPlace();
 }else if(selectedPlace==="やまに のぼります"){
   placeEl.innerHTML=`<span>やま</span><span class="preview-cn">山</span>`;
 }else{
   placeEl.innerHTML=`<span>${selectedPlace}</span><span class="preview-cn">${found?found[1]:""}</span>`;
 }
}
function selectPlace(v){
 if(v!==selectedPlace && (v==="りょこう"||v==="でかけます"))travelDestination="";
 selectedPlace=v;
 if(selectedNoun && !nounFitsPlace(selectedNoun,v)) selectedNoun="";
 if(selectedNoun && selectedVerb && !comboFitsPlace(selectedNoun,selectedVerb,v)) selectedVerb="";
 if(selectedVerb && !verbFitsPlace(selectedVerb,v)) selectedVerb="";
 selectedNoun="";
 selectedVerb="";
 selectedPattern=v==="うち"?"かえります":(v==="やまに のぼります"?"のぼります":(v==="でかけます"?"でかけます":(v==="りょう"?"で":"へいきます")));
 renderPlaces();
 updatePatterns();
 updatePreview();
 renderSecondStage();
 renderNouns();
 renderVerbs();
 refreshPostButton();
}
function selectPattern(v){
 /* 場所を選ぶと自動決定。手動変更はしない */
}
function updatePatterns(){
 /* パターン選択ボタンは廃止。場所に応じて自動決定する */
}
function updatePreview(){
 const firstPlaceBox=document.querySelector(".place-box");
 if(firstPlaceBox)firstPlaceBox.classList.remove("has-de-hint");
 const oldDeHint=document.getElementById("firstStageDeHint");
 if(oldDeHint)oldDeHint.remove();
 const placeJp=document.getElementById("previewPlaceJp");
 const placeCn=document.getElementById("previewPlaceCn");
 const pat=document.getElementById("previewPattern");
 const placeCard=document.getElementById("previewPlace");
 const found=places.find(x=>x[0]===selectedPlace);

 let noun=document.getElementById("upperDormNoun");
 let wo=document.getElementById("upperDormWo");
 let travelInput=document.getElementById("travelDestinationInput");

 if(selectedPlace==="りょこう" || selectedPlace==="でかけます"){
   const isOuting=selectedPlace==="でかけます";
   placeCard.style.display="inline-flex";
   placeJp.textContent=isOuting?"でかけます。":"りょこう";
   placeCn.textContent=isOuting?"外出":"旅行";
   if(!travelInput){
     travelInput=document.createElement("input");
     travelInput.id="travelDestinationInput";
     travelInput.className="travel-destination-input";
     travelInput.placeholder="用中文输入目的地";
     travelInput.value=travelDestination;
     travelInput.addEventListener("input",e=>{
       travelDestination=e.target.value.trim();
       updateTravelSecondPlace();
       refreshPostButton();
       refreshPostButton();
     });
     pat.insertAdjacentElement("afterend",travelInput);
     const go2=document.createElement("span");
     go2.id="travelGoText";
     go2.textContent="へ いきます。";
     travelInput.insertAdjacentElement("afterend",go2);
   }
   travelInput.style.display="inline-block";
   const go2=document.getElementById("travelGoText"); if(go2)go2.style.display="inline";
   pat.textContent=isOuting?"":"へ いきます。";
   const vc=document.getElementById("upperDormVerb"); if(vc)vc.remove();
   if(noun)noun.remove();
   if(wo)wo.remove();
   refreshPostButton();
   updateTravelSecondPlace();
   return;
 }else{
   placeCard.style.display="inline-flex";
   if(travelInput)travelInput.remove();
   const go2=document.getElementById("travelGoText"); if(go2)go2.remove();
 }

 placeJp.textContent=selectedPlace||"＿＿";
 placeCn.textContent=found?found[1]:"";

 if(selectedPlace==="やまに のぼります"){
   const vc=document.getElementById("upperDormVerb"); if(vc)vc.remove();
   if(noun)noun.remove(); if(wo)wo.remove();
   placeJp.textContent="やま"; placeCn.textContent="山";
   pat.textContent="に のぼります。";
 }else if(selectedPlace==="でかけます"){
   const vc=document.getElementById("upperDormVerb"); if(vc)vc.remove();
   if(noun)noun.remove(); if(wo)wo.remove();
   placeJp.textContent="でかけます。"; placeCn.textContent="外出";
   pat.textContent="";
 }else if(selectedPlace==="うち"){
   const vc=document.getElementById("upperDormVerb"); if(vc)vc.remove();
   if(noun)noun.remove();
   if(wo)wo.remove();
   pat.textContent="へ かえります。";
 }else if(selectedPlace==="りょう"){
   pat.textContent="で";
   let deHint=document.getElementById("firstStageDeHint");
   if(!deHint){
     deHint=document.createElement("span");
     deHint.id="firstStageDeHint";
     deHint.className="first-stage-de-hint";
     const firstBox=document.querySelector(".place-box");
     if(firstBox){
       firstBox.classList.add("has-de-hint");
       firstBox.appendChild(deHint);
     }
   }
   deHint.textContent="で";
   if(!noun){
     noun=document.createElement("span");
     noun.id="upperDormNoun";
     noun.className="preview-place";
     noun.innerHTML='<span id="upperDormNounJp"></span><span id="upperDormNounCn" class="preview-cn"></span>';
     pat.insertAdjacentElement("afterend",noun);
   }
   if(!wo){
     wo=document.createElement("span");
     wo.id="upperDormWo";
     noun.insertAdjacentElement("afterend",wo);
   }
   const nf=nouns.find(x=>x[0]===selectedNoun);
   document.getElementById("upperDormNounJp").textContent=selectedNoun||"";
   document.getElementById("upperDormNounCn").textContent=nf?nf[1]:"";
   noun.style.display=selectedNoun?"inline-flex":"none";
   wo.textContent=selectedNoun?"を":"";
   let vc=document.getElementById("upperDormVerb");
   if(!vc && wo){
     vc=document.createElement("span"); vc.id="upperDormVerb"; vc.className="preview-place";
     vc.innerHTML='<span id="upperDormVerbJp"></span><span id="upperDormVerbCn" class="preview-cn"></span>';
     wo.insertAdjacentElement("afterend",vc);
   }
   if(vc){
     const vf=verbs.find(x=>x[0]===selectedVerb);
     document.getElementById("upperDormVerbJp").textContent=selectedVerb||"";
     document.getElementById("upperDormVerbCn").textContent=vf?vf[1]:"";
     vc.style.display=selectedVerb?"inline-flex":"none";
   }
 }else{
   const vc=document.getElementById("upperDormVerb"); if(vc)vc.remove();
   if(noun)noun.remove();
   if(wo)wo.remove();
   pat.textContent=selectedPattern==="へいきます"?"へ いきます。":(selectedPattern||"＿＿＿＿");
 }
 refreshPostButton();
}
function updateTravelSecondPlace(){
 if(selectedPlace!=="りょこう" && selectedPlace!=="でかけます")return;
 const placeEl=document.getElementById("secondPlace");
 const secondLine=document.getElementById("secondPlaceLine");
 if(secondLine)secondLine.style.visibility="visible";
 if(placeEl){
   placeEl.innerHTML=travelDestination ? `<span>${travelDestination}</span>` : "";
   placeEl.style.display=travelDestination?"inline-flex":"none";
 }
 const secondDe=document.getElementById("secondDe");
 if(secondDe)secondDe.style.display=travelDestination?"":"none";
}

function refreshPostButton(){
 const btn=document.getElementById("postBtn");
 if(!btn)return;
 const placeOK=!!selectedPlace;
 const verbOK=!!selectedVerb;
 const destinationOK=!["りょこう","でかけます"].includes(selectedPlace) || !!travelDestination;
 btn.disabled=!(placeOK && verbOK && destinationOK);
}

let activityMode="weekend";
function setActivityMode(mode){
 activityMode=mode;
 const wb=document.getElementById("weekendModeBtn");
 const ab=document.getElementById("afternoonModeBtn");
 if(wb)wb.classList.toggle("active",mode==="weekend");
 if(ab)ab.classList.toggle("active",mode==="afternoon");
 const guide=document.getElementById("modeGuideText");
 if(guide)guide.textContent=mode==="weekend"?"发布一下自己的周末安排吧。":"发布一下自己下午的安排吧。";

 // 見えている質問文だけを切り替える
 const nodes=[...document.querySelectorAll("body *")].filter(el=>el.children.length===0);
 nodes.forEach(el=>{
   if(el.dataset.modeQuestion==="1"){
     el.textContent=mode==="weekend"?"しゅうまつ、なにをしますか。":"ごご、なにをしますか。";
   }else if(el.textContent.trim()==="しゅうまつ、なにをしますか。" || el.textContent.trim()==="ごご、なにをしますか。"){
     el.dataset.modeQuestion="1";
     el.textContent=mode==="weekend"?"しゅうまつ、なにをしますか。":"ごご、なにをしますか。";
   }
 });
}
function postWeekend(){
 if(!selectedPlace||!selectedPattern||!userName)return;
 const lastThree=posts.slice(-3);
 if(lastThree.length===3 && lastThree.every(p=>p.author===userName)){
   alert("发了这么多，谢谢你！");
   return;
 }
 if(!selectedVerb)return;
 if(["りょこう","でかけます"].includes(selectedPlace) && !travelDestination)return;
 

 let lines=[];
 if(selectedPlace==="やまに のぼります"){
   const line1="やまに のぼります。";
   let line2="やまで";
   if(selectedNoun) line2+=selectedNoun+"を";
   if(selectedVerb) line2+=selectedVerb;
   lines=[line1,line2];
 }else if(selectedPlace==="でかけます"){
   const line1="でかけます。"+(travelDestination?travelDestination+"へ いきます。":"");
   let line2=(travelDestination?travelDestination:"")+"で";
   if(selectedNoun) line2+=selectedNoun+"を";
   if(selectedVerb) line2+=selectedVerb;
   lines=[line1,line2];
 }else if(selectedPlace==="うち"){
   const line1="うちへ かえります。";
   let line2="うちで";
   if(selectedNoun) line2+=selectedNoun+"を";
   if(selectedVerb) line2+=selectedVerb;
   lines=[line1,line2];
 }else if(selectedPlace==="りょう"){
   let line="りょうで";
   if(selectedNoun) line+=selectedNoun+"を";
   if(selectedVerb) line+=selectedVerb;
   lines=[line];
 }else if(selectedPlace==="りょこう"){
   const line1="りょこうへ いきます。"+(travelDestination?travelDestination+"へ いきます。":"");
   let line2=(travelDestination?travelDestination:"")+"で";
   if(selectedNoun) line2+=selectedNoun+"を";
   if(selectedVerb) line2+=selectedVerb;
   lines=[line1,line2];
 }else{
   const line1=selectedPlace+"へ いきます。";
   let line2=selectedPlace+"で";
   if(selectedNoun) line2+=selectedNoun+"を";
   if(selectedVerb) line2+=selectedVerb;
   lines=[line1,line2];
 }

 posts.push({
   id:Date.now(), author:userName, mode:activityMode, lines,
   place:selectedPlace, destination:(selectedPlace==="りょこう"||selectedPlace==="でかけます")?travelDestination:"",
   noun:selectedNoun, verb:selectedVerb, pattern:selectedPattern, meTooCount:0
 });
 localStorage.setItem("weekend_posts_v1",JSON.stringify(posts));
 renderPosts();

 selectedPlace=""; selectedPattern=""; selectedNoun=""; selectedVerb=""; travelDestination="";
 renderPlaces(); updatePatterns(); updatePreview(); renderSecondStage();
}
const METOO_KEY="weekend_metoo_by_name_v1";
function meTooMap(){try{return JSON.parse(localStorage.getItem(METOO_KEY))||{}}catch{return {}}}
function meTooKey(id){return userName+"::"+id}
function hasMeToo(id){return !!meTooMap()[meTooKey(id)]}
function rememberMeToo(id){
 const m=meTooMap(); m[meTooKey(id)]=true;
 localStorage.setItem(METOO_KEY,JSON.stringify(m));
}
function toggleMeToo(id){
 const p=posts.find(x=>x.id===id);
 const unlimited=userName==="あさの";
 if(!p || (!unlimited && hasMeToo(id)))return;
 if(!unlimited)rememberMeToo(id);
 if(p.meTooCount==null)p.meTooCount=Array.isArray(p.meToo)?p.meToo.length:0;
 p.meTooCount++;
 localStorage.setItem("weekend_posts_v1",JSON.stringify(posts));
 renderPosts();
}
function renderPosts(){
 const feed=document.getElementById("feed");
 feed.innerHTML="";
 posts.slice().reverse().forEach(p=>{
   const d=document.createElement("div");
   d.className="post";

   if(Array.isArray(p.lines)){
     const placeFound=places.find(x=>x[0]===p.place);
     const nounFound=nouns.find(x=>x[0]===p.noun);
     const verbFound=verbs.find(x=>x[0]===p.verb);
     const placeCn=placeFound?placeFound[1]:"";
     const nounCn=nounFound?nounFound[1]:"";
     const verbCn=verbFound?verbFound[1]:"";

     const card=(jp,cn)=>`<span class="posted-card"><span>${jp}</span><span class="posted-cn">${cn}</span></span>`;
     const name=`<span class="posted-name">${p.author?`（${p.author}）`:""}</span>`;
     const modePrefix=`<span class="posted-mode-prefix">${p.mode==="afternoon"?"ごご、":"しゅうまつ、"}</span>`;

     if(p.place==="やまに のぼります"){
       const row1=`<div class="posted-row">${name}${modePrefix}${card("やま","山")}<span>に のぼります。</span></div>`;
       const row2=`<div class="posted-row posted-row-second"><span class="posted-name posted-name-spacer">${p.author?`（${p.author}）`:""}</span>${card("やま","山")}<span>で</span>${p.noun?card(p.noun,nounCn):""}${p.noun?"<span>を</span>":""}${p.verb?card(p.verb,verbCn):""}</div>`;
       d.innerHTML=row1+row2;
     }else if(p.place==="でかけます"){
       const dest=p.destination?`<span class="posted-card posted-destination"><span>${p.destination}</span></span>`:"";
       const row1=`<div class="posted-row">${name}${modePrefix}${card("でかけます。","外出")}${dest}<span>へ いきます。</span></div>`;
       const row2=`<div class="posted-row posted-row-second"><span class="posted-name posted-name-spacer">${p.author?`（${p.author}）`:""}</span>${dest}<span>で</span>${p.noun?card(p.noun,nounCn):""}${p.noun?"<span>を</span>":""}${p.verb?card(p.verb,verbCn):""}</div>`;
       d.innerHTML=row1+row2;
     }else if(p.place==="うち"){
       const row1=`<div class="posted-row">${name}${modePrefix}${card("うち",placeCn)}<span>へ かえります。</span></div>`;
       const row2=`<div class="posted-row posted-row-second"><span class="posted-name posted-name-spacer">${p.author?`（${p.author}）`:""}</span>${card("うち",placeCn)}<span>で</span>${p.noun?card(p.noun,nounCn):""}${p.noun?"<span>を</span>":""}${p.verb?card(p.verb,verbCn):""}</div>`;
       d.innerHTML=row1+row2;
     }else if(p.place==="りょう"){
       d.innerHTML=`<div class="posted-row">${name}${modePrefix}${card("りょう",placeCn)}<span>で</span>${p.noun?card(p.noun,nounCn):""}${p.noun?"<span>を</span>":""}${p.verb?card(p.verb,verbCn):""}</div>`;
     }else if(p.place==="りょこう"){
       const dest=p.destination?`<span class="posted-card posted-destination"><span>${p.destination}</span></span>`:"";
       const row1=`<div class="posted-row">${name}${modePrefix}${card("りょこう","旅行")}<span>へ いきます。</span>${dest}<span>へ いきます。</span></div>`;
       const row2=`<div class="posted-row posted-row-second"><span class="posted-name posted-name-spacer">${p.author?`（${p.author}）`:""}</span>${dest}<span>で</span>${p.noun?card(p.noun,nounCn):""}${p.noun?"<span>を</span>":""}${p.verb?card(p.verb,verbCn):""}</div>`;
       d.innerHTML=row1+row2;
     }else{
       const row1=`<div class="posted-row">${name}${modePrefix}${card(p.place,placeCn)}<span>へ いきます。</span></div>`;
       const row2=`<div class="posted-row posted-row-second"><span class="posted-name posted-name-spacer">${p.author?`（${p.author}）`:""}</span>${card(p.place,placeCn)}<span>で</span>${p.noun?card(p.noun,nounCn):""}${p.noun?"<span>を</span>":""}${p.verb?card(p.verb,verbCn):""}</div>`;
       d.innerHTML=row1+row2;
     }
   }else{
     d.textContent=(p.author?`（${p.author}）`:"")+(p.text||"");
   }

   {
     const verbText=p.verb||"";
     if(p.meTooCount==null)p.meTooCount=Array.isArray(p.meToo)?p.meToo.length:0;
     const wrap=document.createElement("div");
     wrap.className="me-too-wrap";
     const count=document.createElement("span");
     count.className="me-too-count";
     count.textContent=p.meTooCount>0?`✋×${p.meTooCount}`:"";
     const btn=document.createElement("button");
     const done=hasMeToo(p.id);
     btn.className="me-too-btn"+(done?" liked":"");
     btn.disabled=done;
     btn.textContent=verbText?`✋ 私も ${verbText}`:"✋ 私も";
     btn.onclick=()=>toggleMeToo(p.id);
     wrap.appendChild(count);
     wrap.appendChild(btn);
     d.appendChild(wrap);
   }
   feed.appendChild(d);
 });
}
document.getElementById("nameInput").value=userName;
document.getElementById("nameModal").style.display="flex";
document.getElementById("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")saveName()});
renderPlaces();updatePatterns();updatePreview();renderSecondStage();renderPosts();
refreshPostButton();
</script>
</body>
