<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>しゅうまつ、なにをしますか。</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#dcebd4;--panel:#fff;--ink:#292929;--line:#9fbe91;
  --area:#c7e2b9;--btn:#edf7e8;--sel:#79b85d;--dark:#3f7e2e;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
font-family:"Yu Kyokasho","YuKyokasho","BIZ UDPGothic","Noto Sans JP",sans-serif}
.app{width:min(1050px,96vw);margin:auto;padding:10px 0 24px}
.board-title{font-size:13px;color:#777;margin:0 0 3px 3px}
.feed{height:275px;overflow-y:auto;background:rgba(255,255,255,.75);border:1px solid var(--line);
border-radius:14px;padding:5px;display:flex;flex-direction:column;gap:4px}
.empty{height:100%;display:grid;place-items:center;color:#aaa;font-size:14px}
.post{background:#fff;border:1px solid #dbe6d6;border-left:4px solid var(--sel);
border-radius:9px;padding:6px;font-size:16px;flex:0 0 auto}
.composer{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.guide{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;color:#666;font-size:14px;margin-bottom:3px}
.question{text-align:center;font-size:20px;font-weight:600;margin:3px 0 6px}
.preview{display:flex;justify-content:center;align-items:center;gap:5px;min-height:40px;
font-size:19px;font-weight:600;white-space:nowrap;margin-bottom:5px}
.preview-place{
 position:relative;background:var(--area);color:#315f24;border-radius:8px;padding:5px 8px}
.post-btn{border:0;border-radius:9px;background:var(--dark);color:#fff;padding:8px 16px;font-weight:700;cursor:pointer}
.post-btn:disabled{opacity:.28;cursor:default}
.place-box{background:var(--area);border-radius:11px;padding:6px}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.choice{min-height:39px;border:1px solid #76a862;border-radius:7px;background:var(--btn);color:#315f24;
padding:3px 2px;cursor:pointer;font:inherit}
.choice.selected{background:var(--sel);border-color:#3f7e2e}
.jp{display:block;font-size:14px;font-weight:600;line-height:1}
.cn{display:block;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:10px;line-height:1;
margin-top:3px;opacity:.75}
.patterns{display:flex;justify-content:center;gap:8px;margin-top:5px}
.pattern{min-width:120px;border:1px solid #76a862;border-radius:8px;background:var(--btn);color:#315f24;
padding:7px 10px;font:600 17px inherit;cursor:pointer;transition:.15s}
.pattern.selected{background:var(--sel);border-color:#3f7e2e}
.pattern.disabled{opacity:.18;cursor:default;filter:grayscale(.5)}
.name-modal{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:99;display:flex;align-items:center;justify-content:center}
.name-box{background:#fff;border-radius:16px;padding:22px;width:min(340px,90vw);text-align:center}
.name-input{width:100%;border:1.5px solid #ccc;border-radius:10px;padding:11px;font-size:16px;text-align:center}
.name-save{margin-top:12px;border:0;border-radius:9px;background:var(--dark);color:#fff;padding:9px 22px;font-weight:700}
.hidden{display:none!important}
@media(max-width:700px){
 .app{padding-top:5px}.feed{height:275px}.composer{margin-top:6px;padding:6px}
 .guide{font-size:13px;margin-bottom:1px}.question{font-size:15px;margin:2px 0 3px}
 .preview{font-size:15px;min-height:32px;gap:3px;margin-bottom:3px}.preview-place{padding:4px 5px}
 .choices{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
 .choice{min-height:34px;padding:2px 1px}.jp{font-size:13px}.cn{font-size:10px;margin-top:2px}
 .patterns{margin-top:4px;gap:5px}.pattern{min-width:105px;padding:5px 7px;font-size:15px}
 .post-btn{padding:6px 10px;font-size:12px}input{font-size:16px!important}
}

.preview-place,.post-place{position:relative;margin-bottom:10px}
.preview-cn,.post-cn{
  position:absolute;left:0;right:0;top:calc(100% + 2px);
  text-align:center;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:11px;font-weight:500;line-height:1;color:#555;white-space:nowrap
}
.post-line{display:flex;align-items:center;gap:3px;white-space:nowrap;min-height:34px}
.post-place{display:inline-flex;align-items:center;justify-content:center;background:var(--area);
  color:#315f24;border-radius:7px;padding:4px 6px}
@media(max-width:700px){

 .preview-place,.post-place{margin-bottom:9px}
}


.second-stage{display:none;margin-top:4px}
.second-stage.show{display:block}
.second-place-box{background:var(--area);border-radius:11px;padding:6px}
.second-choice{min-height:39px;border:1px solid #76a862;border-radius:7px;background:var(--btn);
 color:#315f24;padding:3px 2px;font:inherit}
.second-choice.locked{opacity:.18}
.second-choice.active{background:var(--sel);border-color:#3f7e2e}
.second-patterns{display:flex;justify-content:center;margin-top:4px}
.second-de{min-width:120px;border:1px solid #76a862;border-radius:8px;background:var(--btn);
 color:#315f24;padding:7px 10px;font:600 17px inherit;cursor:pointer}
.second-de.selected{background:var(--sel);border-color:#3f7e2e}

/* 投稿の訳は日本語の下に固定。文の位置を上げない */
.post{padding-bottom:13px}
.post-line{min-height:38px;align-items:flex-start;padding-top:4px}
.post-place{margin-bottom:0!important}
.post-cn{top:calc(100% + 2px)!important;transform:none!important;line-height:1!important}

@media(max-width:700px){
 .second-stage{margin-top:3px}
 .second-place-box{padding:3px}
 .second-choice{min-height:34px;padding:2px 1px}
 .second-patterns{margin-top:3px}
 .second-de{min-width:105px;padding:5px 7px;font-size:15px}
 .post{padding-bottom:12px}
 .post-line{min-height:36px;padding-top:3px}
}

  padding-bottom:13px !important;

/* ===== 2段目 名詞群 ===== */
.noun-area{margin-top:5px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.noun-group{background:#fffbd1;border-radius:14px;padding:7px}
.noun-group:last-child{grid-column:1 / -1}
.noun-title{text-align:center;font-size:12px;font-weight:700;margin-bottom:5px;color:#555}
.noun-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}

 .noun-choice{min-height:34px;font-size:12px}
 .noun-group:last-child .noun-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}


/* ===== 名詞群は分類せず1つに統一 ===== */
.noun-area{
 display:grid !important;

function nounFitsPlace(noun,place){
 if(!place)return true;
 return !(placeNounBlocked[place]||[]).includes(noun);
}

/* 名詞単体では成立しても、その場所で「スポーツをする」だけは不自然な場合 */
function comboFitsPlace(noun,verb,place){
 if(!place)return true;
 if(place==="しょくどう" && verb==="かいます。" && !["ごはん","ビール"].includes(noun))return false;
 if(place==="しょくどう" && noun==="ダンス" && verb==="します。")return false;
 if(verb==="します。" && sportsNouns.has(noun) && ["りょう","しょくどう","スーパー","カラオケ"].includes(place)) return false;
 return true;
}

function nounFitsVerb(noun,verb){
 if(!verb)return true;
 if(noNounVerbs.has(verb))return false;
 return (nounVerbMap[noun]||[]).includes(verb);
}
function verbFitsNoun(verb,noun){
 if(!noun)return true;
 return nounFitsVerb(noun,verb);
}
function verbFitsPlace(verb,place){
 if(!place)return true;
 if(["たいいくかん","コート"].includes(place) && new Set(["かいものします。","そうじします。","うたいます。","～と でんわします","～と あいます"]).has(verb))return false;
 if(place==="スーパー" && verb==="たべます。")return false;
 if(verb==="かいます。" && ["カラオケ","コート","たいいくかん","グラウンド","うち","としょかん"].includes(place))return false;
 if(place==="カラオケ" && new Set(["うんどうします。","かいものします。","あるきます。","さんぽします。","はしります。","そうじします。","～と でんわします","～と あいます"]).has(verb))return false;
 /* 場所が意味上ほぼ決まる動詞だけ制限する */
 if(verb==="やまに のぼります。")return place==="やま";
 
 if(verb==="つくります。" && ["りょう","としょかん","スーパー"].includes(place))return false;
 if(verb==="かいます。" && ["りょう","としょかん"].includes(place))return false;
 return true;
}
function hasAvailableVerbForNoun(noun){
 /* 現在の場所で、この名詞を選んだあと1つでも選べる動詞が残るか */
 return verbs.some(([v])=>
   nounFitsVerb(noun,v) &&
   verbFitsPlace(v,selectedPlace) &&
   comboFitsPlace(noun,v,selectedPlace)
 );
}
function refreshCompatibility(){

   const leavesVerb=hasAvailableVerbForNoun(n);
   const ok=placeOK && currentVerbOK && leavesVerb;
   btn.disabled=!ok;
   btn.classList.toggle("choice-disabled",!ok);
 });
 document.querySelectorAll("#verbArea .verb-choice").forEach(btn=>{
   const v=btn.dataset.value;
   const verbData=verbs.find(x=>x[0]===v);
   const type=verbData?verbData[2]:"";

            verbFitsNoun(v,selectedNoun) &&
            verbFitsPlace(v,selectedPlace) &&

function layoutMeTooButtons(){
 requestAnimationFrame(()=>{
  document.querySelectorAll(".post").forEach(post=>{
   const wrap=post.querySelector(".me-too-wrap");
   const rows=[...post.querySelectorAll(".posted-row")];
   if(!wrap||!rows.length)return;

   let count=wrap.querySelector(".me-too-count") || post.querySelector(":scope > .me-too-count");
   post.classList.remove("metoo-inline","metoo-row2","metoo-row3");
   wrap.removeAttribute("style");

   // ✋×N は常に一段目右端。行レイアウトから完全に外す。
   if(count && count.textContent){
     if(count.parentElement!==post) post.appendChild(count);
     count.removeAttribute("style");
     const pr=post.getBoundingClientRect();
     const first=rows[0].getBoundingClientRect();
     const ch=count.getBoundingClientRect().height||16;
     count.style.position="absolute";
     count.style.right="6px";
     count.style.left="auto";
     count.style.top=(first.top-pr.top+(first.height-ch)/2)+"px";
     count.style.bottom="auto";
     count.style.margin="0";
     count.style.transform="none";
   }else if(count && count.parentElement!==wrap){
     wrap.insertBefore(count,wrap.firstChild);
   }

   const lastRow=rows[rows.length-1];
   const content=[...lastRow.children].filter(el=>{
     const cs=getComputedStyle(el);
     return !el.classList.contains("me-too-count") &&
            !el.closest(".me-too-wrap") &&
            cs.display!=="none" && cs.visibility!=="hidden";
   });
   const lastContent=content[content.length-1]||lastRow;
   const pr=post.getBoundingClientRect();
   const rr=lastRow.getBoundingClientRect();
   const cr=lastContent.getBoundingClientRect();

   // countを含まないボタン幅だけ測る
   wrap.style.position="absolute";
   wrap.style.visibility="hidden";
   wrap.style.width="max-content";
   wrap.style.maxWidth="none";
   const wr=wrap.getBoundingClientRect();
   const ww=Math.ceil(wr.width), wh=Math.ceil(wr.height);
   const available=Math.floor(pr.right-6-cr.right);

   if(available>=ww+7){
     post.classList.add("metoo-inline");
     wrap.style.left="auto";
     wrap.style.right="6px";
     wrap.style.top=(rr.top-pr.top+(rr.height-wh)/2)+"px";
     wrap.style.bottom="auto";
   }else{
     wrap.removeAttribute("style");
     post.classList.add(rows.length===1?"metoo-row2":"metoo-row3");
   }
   wrap.style.visibility="";
  });
 });
}

function rememberMeToo(id){

 localStorage.setItem(METOO_KEY,JSON.stringify(m));
}

const DB_POSTS_PATH="weekendSentence/posts";

async function initFirebaseSync(){
 try{
  const appMod=await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js");
  const dbMod=await import("https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js");

  db=dbMod.getDatabase(app);

   const val=snap.val()||{};
   const remote=Object.entries(val).map(([id,p])=>({
    ...p,

    meTooCount:Number(p.meTooCount||0)
   }));

    for(const p of localOnly){
     try{
      await dbSet(dbRef(db,DB_POSTS_PATH+"/"+String(p.id)),{
       ...p, createdAt:p.createdAt||Number(p.id)||Date.now()
      });
     }catch(e){console.error("local migration error",e)}
    }
    if(localOnly.length)return;
   }

   posts=remote.sort((a,b)=>Number(a.createdAt||a.id||0)-Number(b.createdAt||b.id||0));

/* ===== v112 オフライン操作キュー ===== */
const OFFLINE_QUEUE_KEY="weekend_offline_queue_v1";
function readOfflineQueue(){
 try{return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY))||[]}
 catch{return []}
}
function writeOfflineQueue(q){
 localStorage.setItem(OFFLINE_QUEUE_KEY,JSON.stringify(q));
}
function queueOfflineOp(op){
 const q=readOfflineQueue();
 q.push({...op,qid:Date.now()+"_"+Math.random().toString(36).slice(2)});
 writeOfflineQueue(q);
}
async function flushOfflineQueue(){
 if(!firebaseReady || !navigator.onLine)return;
 const q=readOfflineQueue();
 if(!q.length)return;
 const remain=[];
 for(const op of q){
  try{
   if(op.type==="post"){
    await dbSet(dbRef(db,DB_POSTS_PATH+"/"+String(op.post.id)),{
     ...op.post,createdAt:op.post.createdAt||Number(op.post.id)||Date.now()
    });
   }else if(op.type==="delete"){
    await dbRemove(dbRef(db,DB_POSTS_PATH+"/"+String(op.id)));
   }else if(op.type==="metoo"){
    await dbRunTransaction(
     dbRef(db,DB_POSTS_PATH+"/"+String(op.id)+"/meTooCount"),
     v=>Number(v||0)+Number(op.amount||1)
    );
   }
  }catch(e){
   remain.push(op);
  }
 }
 writeOfflineQueue(remain);
}

   /* 既存投稿で「相手と動詞」が一枚のカードになっている場合も分離 */
   post.querySelectorAll("[class*='card']").forEach(card=>{
     const jp=card.querySelector(".jp");
     if(!jp)return;
     const text=jp.textContent.trim().replace(/。+$/,"");
     const m=text.match(/^(ともだち|かぞく|こいびと)と(.+)$/);
     if(!m)return;

     const partner=m[1], verb=m[2];
     jp.textContent=verb;

     const partnerCard=card.cloneNode(true);
     partnerCard.classList.add("post-partner-card");
     const pjp=partnerCard.querySelector(".jp");
     const pcn=partnerCard.querySelector(".cn");
     if(pjp)pjp.textContent=partner;
     if(pcn)pcn.textContent=partnerCn[partner]||"";

     const particle=document.createElement("span");
     particle.className="post-to-particle";
     particle.textContent="と";

     card.insertAdjacentElement("beforebegin",partnerCard);
     card.insertAdjacentElement("beforebegin",particle);
   });
 }

 const run=()=>document.querySelectorAll("#feed .post").forEach(fixToPost);
 const feed=document.getElementById("feed");
 if(feed)new MutationObserver(()=>setTimeout(run,0)).observe(feed,{childList:true,subtree:true});
 setTimeout(run,0);
})();
</script>


<script>
/* 名詞未選択時の空カード余白を消す */
(()=>{
 function fixEmptyNounGap(){
   const n=document.getElementById("inlineNounCard");
   if(!n)return;
   const jp=document.getElementById("inlineNounJp");
   const empty=!jp || !jp.textContent.trim();
   n.style.display=empty?"none":"";
   n.style.margin=empty?"0":"";
 }
 document.addEventListener("click",()=>setTimeout(fixEmptyNounGap,0));
 const n=document.getElementById("inlineNounCard");
 if(n)new MutationObserver(fixEmptyNounGap).observe(n,{childList:true,subtree:true,characterData:true,attributes:true});
 setTimeout(fixEmptyNounGap,0);
})();
</script>


<style>
/* 2文目：名詞なし時は「で、」→動詞カードを通常の文字間隔で直結 */
#inlineNounCard.no-noun{
 display:none !important;
 margin:0 !important;
 padding:0 !important;
 width:0 !important;
 min-width:0 !important;
}
#inlineVerbCard.after-no-noun{
 margin-left:-7px !important;
}
</style>
<script>
(()=>{
 function fixSecondLineNoNounGap(){
   const noun=document.getElementById("inlineNounCard");
   const verb=document.getElementById("inlineVerbCard");
   if(!noun||!verb)return;

   const jp=document.getElementById("inlineNounJp");
   const empty=!selectedNoun || !jp || !jp.textContent.trim();

   noun.classList.toggle("no-noun",empty);
   verb.classList.toggle("after-no-noun",empty);

   if(empty){
     /* noun と verb の間にある空白だけのテキストノードも除去 */
     let n=noun.nextSibling;
     while(n && n!==verb){
       const next=n.nextSibling;
       if(n.nodeType===3 && !n.textContent.trim()) n.remove();
       n=next;
     }
   }
 }
 document.addEventListener("click",()=>requestAnimationFrame(fixSecondLineNoNounGap));
 const target=document.getElementById("inlineNounCard");
 if(target)new MutationObserver(()=>requestAnimationFrame(fixSecondLineNoNounGap))
   .observe(target,{childList:true,subtree:true,characterData:true,attributes:true});
 setTimeout(fixSecondLineNoNounGap,0);
})();
</script>
